version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: fittrack-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: fittrack
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: