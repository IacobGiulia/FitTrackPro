<div class="login-container">
  <h1>FitTrack</h1>

  <form (ngSubmit)="login()">
    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Email"
      required
      />
    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="password"
      required=""
      />
    <button type="submit">
      Login
    </button>

  </form>
</div>
